<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>CampusEats | Secured Catalogue</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark">C</span><span>CampusEats</span></a>
    <div class="top-actions">
      <span id="session-label" class="session-label">Not signed in</span>
      <button id="logout-button" class="button button-quiet hidden" type="button">Sign out</button>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero">
      <div>
        <h1>A safer way to serve<br><span>the campus menu.</span></h1>
      </div>
    </section>

    <section id="login-panel" class="panel login-panel">
      <div class="section-heading">
        <div><p class="eyebrow">WELCOME BACK</p><h2>Sign in</h2></div>
        <span class="lock-icon">⌑</span>
      </div>
      <form id="login-form" class="login-form">
        <label>Email address<input id="email" type="email" autocomplete="username" placeholder="example@gmail.com" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label>
        <button class="button button-primary" type="submit">Sign in <span>→</span></button>
      </form>
    </section>

    <section id="catalogue-panel" class="panel hidden">
      <div class="section-heading catalogue-heading">
        <div><p class="eyebrow">CAMPUS MENU</p><h2>Available items</h2></div>
        <button id="refresh-button" class="button button-quiet" type="button">↻ Refresh</button>
      </div>
      <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
      <div id="items-list" class="items-list"></div>
      <form id="add-form" class="add-form hidden">
        <div class="form-title"><p class="eyebrow">RESTAURANT TOOLS</p><h3>Add a menu item</h3></div>
        <label>Dish name<input id="item-name" type="text" maxlength="60" placeholder="e.g. Idli Sambar" required></label>
        <label>Price (₹)<input id="item-price" type="number" min="0" step="0.01" placeholder="60" required></label>
        <button class="button button-primary" type="submit">Add item <span>＋</span></button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
