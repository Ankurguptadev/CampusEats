<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats Menu</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>CampusEats Menu</h1>
      <p class="sub">Menu catalogue <span id="count">Loading</span></p>
    </header>

    <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>

    <section aria-labelledby="menu-heading">
      <h2 class="section-title" id="menu-heading">Available dishes</h2>
      <div id="list" class="loading">Loading menu&hellip;</div>
    </section>

    <form id="addForm">
      <h2>Add a dish</h2>
      <div class="form-row">
        <input id="name" name="name" placeholder="Dish name" aria-label="Dish name" required>
        <input id="price" name="price" type="number" min="1" step="0.01" placeholder="Price (rupees)" aria-label="Price in rupees" required>
        <label><input id="available" name="available" type="checkbox" checked> Available</label>
        <button type="submit">Add dish</button>
      </div>
    </form>
  </main>
</body>
</html>
