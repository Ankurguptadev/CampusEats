openapi: 3.0.3
info:
  title: CampusEats Catalogue
  version: "2.0.0"
  description: Assignment 5 continuation of the Assignment 4 Catalogue Service.
servers:
  - url: http://localhost:8080
  - url: https://api.campuseats.dev

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Restaurant:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        area: {type: string}
        tier: {type: string, enum: [budget, premium]}
        active: {type: boolean}
    NewMenuItem:
      type: object
      required: [name, price]
      properties:
        name: {type: string}
        price: {type: integer, minimum: 1}
    MenuItem:
      type: object
      properties:
        id: {type: integer}
        restaurantId: {type: integer}
        name: {type: string}
        price: {type: integer}
        available: {type: boolean}
        createdAt: {type: string, format: date-time}
    PatchMenuItem:
      type: object
      minProperties: 1
      properties:
        name: {type: string}
        price: {type: integer, minimum: 1}
        available: {type: boolean}
    AvailabilityUpdate:
      type: object
      required: [available]
      properties:
        available: {type: boolean}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}

paths:
  /restaurants:
    get:
      summary: List restaurants with filter, sort and pagination
      parameters:
        - {in: query, name: area, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {in: query, name: sort, schema: {type: string, enum: [id, name, area, tier]}}
        - {in: query, name: order, schema: {type: string, enum: [asc, desc], default: asc}}
      responses:
        "200":
          description: Restaurant list
          headers:
            Cache-Control: {schema: {type: string}}
            X-RateLimit-Limit: {schema: {type: integer}}
            X-RateLimit-Remaining: {schema: {type: integer}}
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Restaurant"}}
        "400": {description: Invalid query, content: {application/json: {schema: {$ref: "#/components/schemas/Problem"}}}}

  /restaurants/{restaurantId}/menu-items:
    get:
      summary: Read a restaurant menu
      parameters:
        - {in: path, name: restaurantId, required: true, schema: {type: integer}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {in: query, name: sort, schema: {type: string, enum: [id, name, price]}}
        - {in: query, name: order, schema: {type: string, enum: [asc, desc], default: asc}}
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MenuItem"}}
        "404": {description: Restaurant not found}
    post:
      summary: Create a menu item
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: restaurantId, required: true, schema: {type: integer}}
        - {in: header, name: Idempotency-Key, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/NewMenuItem"}}
      responses:
        "201":
          description: Created
          headers:
            Location: {schema: {type: string}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/MenuItem"}}
        "200": {description: Repeated Idempotency-Key}
        "400": {description: Bad request}
        "401": {description: Unauthorized}
        "404": {description: Restaurant not found}
        "409": {description: Duplicate item}
        "422": {description: Tier price rule rejected}

  /menu-items/{id}:
    get:
      summary: Read one menu item
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
        - {in: header, name: If-None-Match, schema: {type: string}}
      responses:
        "200":
          description: Menu item
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json: {schema: {$ref: "#/components/schemas/MenuItem"}}
        "304": {description: Not modified}
        "404": {description: Not found}
        "406": {description: Not acceptable}
    put:
      summary: Replace a menu item
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/NewMenuItem"}}
      responses:
        "200": {description: Updated}
        "400": {description: Invalid request}
        "401": {description: Unauthorized}
        "404": {description: Not found}
        "409": {description: Duplicate}
        "412": {description: Stale ETag}
        "422": {description: Tier cap}
    patch:
      summary: Partially modify a menu item
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
        - {in: header, name: If-Match, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/PatchMenuItem"}}
      responses:
        "200": {description: Updated}
        "400": {description: Invalid request}
        "401": {description: Unauthorized}
        "404": {description: Not found}
        "409": {description: Conflict}
        "412": {description: Stale ETag}
        "422": {description: Tier cap}
    delete:
      summary: Delete a menu item
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
      responses:
        "204": {description: Deleted}
        "401": {description: Unauthorized}
        "404": {description: Not found}
    options:
      summary: Discover methods
      responses:
        "204":
          description: Allowed methods
          headers:
            Allow: {schema: {type: string}}
            Access-Control-Allow-Origin: {schema: {type: string}}

  /menu-items/{id}/availability:
    post:
      summary: Change menu item availability
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/AvailabilityUpdate"}}
      responses:
        "200": {description: Updated}
        "400": {description: Invalid request}
        "401": {description: Unauthorized}
        "404": {description: Not found}
        "409": {description: Inactive restaurant}
